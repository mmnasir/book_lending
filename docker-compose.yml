services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: book_lending_app
    ports:
      - "8888:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: book_lending_db
    restart: always
    environment:
      MYSQL_DATABASE: book_lending
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
